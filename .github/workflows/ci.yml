name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Build environment
        run: |
          sw_vers
          uname -m
          /usr/bin/python3 --version
          xcrun swiftc --version
      - name: Integration tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          bash -n scripts/install.sh scripts/build-app.sh
          node --check web/app.js
          node --check web/space-sdk.js
          node --check web/shell.js
          node --check scripts/preview-assets/preview.js
          node --check tests/ui_run.mjs
      - name: Install browser test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Browser integration checks
        run: npm run test:ui
      - name: Build native app
        run: ./scripts/build-app.sh
      - name: Verify signature and packaged CLI
        run: |
          codesign --verify --deep --strict "out/Grok Spaces.app"
          "out/Grok Spaces.app/Contents/MacOS/grok-space" --data-dir "$RUNNER_TEMP/grok-space-cli" doctor --summary
      - name: Native WebKit smoke check
        run: /usr/bin/python3 tests/native_smoke.py
